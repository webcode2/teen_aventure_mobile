services:
  postgres:
    image: postgres:16
    container_name: askhub-pg
    environment:
      POSTGRES_USER: askhub
      POSTGRES_PASSWORD: askhub
      POSTGRES_DB: askhub
    ports:
      - "5433:5432"
    volumes:
      - askhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askhub -d askhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  askhub_pg:
