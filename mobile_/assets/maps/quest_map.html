<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quest journey</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#fcfefc}
html,body{height:100%;overflow:hidden;background:#17655e;overscroll-behavior:none}
.camera{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;outline:none}
.camera.dragging{cursor:grabbing}
#scene,.pins{position:absolute;inset:0;width:100%;height:100%}
#scene{pointer-events:none}.pins{pointer-events:none}
.hud{position:fixed;top:8px;left:10px;right:10px;max-width:440px;margin:auto;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#011f3b;border:1px solid #52747c;border-radius:14px}
.hud-copy{flex:1;min-width:0}h1{font-size:15px;line-height:1.3}.status{font-size:12px;line-height:1.4;color:#d5e8e2}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.return{min-height:44px;padding:9px 12px;border:1px solid #ffe7ad;border-radius:10px;background:#f4b942;color:#011f3b;font-size:12px;font-weight:800;flex-shrink:0}
button:focus-visible,.camera:focus-visible{outline:3px solid #f4b942;outline-offset:3px}
.pin{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border:3px solid #d5eee5;border-radius:50%;background:#159a9c;color:#fff;font-size:17px;font-weight:800;pointer-events:auto;box-shadow:0 3px 0 #164b4d;display:grid;place-content:center;gap:1px}
.pin[hidden]{display:none}.pin.current{width:56px;height:56px;background:#f4b942;border-color:#fff1c4;color:#011f3b;box-shadow:0 3px 0 #8e631f}
.pin.completed{background:#2f7d5a}.pin.locked{background:#456b70;color:#e5edeb;border-color:#a3b9b3}
.stars{font-size:8px;color:#ffe49b;letter-spacing:1px}.current-label{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff2c6;border-radius:6px;padding:4px 7px;font-size:9px;color:#011f3b}
.lock,.checkpoint{position:absolute;right:-4px;top:-5px;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:#f4b942;color:#011f3b;font-size:11px;border:1px solid #fff1c4}
button:disabled{opacity:.5}
@media(max-width:340px){.hud{top:6px;left:6px;right:6px;padding:6px 8px}h1{font-size:14px}}

.finish-landmark{position:absolute;width:154px;height:142px;transform:translateX(-50%);pointer-events:none;text-align:center;color:#fff2c6}
.finish-landmark[hidden]{display:none}.finish-landmark svg{display:block;width:142px;height:114px;margin:auto}
.finish-landmark strong{display:block;background:#011f3b;border:1px solid #f4b942;border-radius:7px;padding:5px 6px;font-size:11px;line-height:16px;letter-spacing:.4px}
@media(max-height:480px){.finish-landmark{width:130px;height:118px}.finish-landmark svg{width:112px;height:90px}.finish-landmark strong{font-size:10px;padding:3px}}
</style></head><body>
<nav class="hud" aria-label="Quest journey"><div class="hud-copy"><h1>Quest journey</h1><div class="status" id="status">Loading your trail…</div></div><button class="return" id="return" type="button" disabled>My quest</button></nav>
<div class="camera" id="camera" tabindex="0" role="region" aria-label="Adventure map. Drag to pan; pinch to zoom. Arrow keys move the map."><canvas id="scene" aria-hidden="true"></canvas><div class="pins" id="pins" aria-label="Quest levels"></div>
<div class="finish-landmark" id="finish-landmark" role="img" aria-label="Journey finish: the adventure house at Quest 52" hidden>
<svg viewBox="0 0 180 140" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="90" cy="128" rx="77" ry="10" fill="#164b4d"/>
<path d="M20 124V65H160V124Z" fill="#e6d7b8" stroke="#011f3b" stroke-width="3"/>
<path d="M65 123V47H115V123Z" fill="#fcfefc" stroke="#011f3b" stroke-width="3"/>
<path d="M10 67L46 36L76 67Z M104 67L135 36L170 67Z" fill="#159a9c" stroke="#011f3b" stroke-width="3" stroke-linejoin="round"/>
<path d="M54 48L90 12L126 48Z" fill="#159a9c" stroke="#011f3b" stroke-width="3" stroke-linejoin="round"/>
<path d="M62 46L90 20L118 46" fill="none" stroke="#87d2c6" stroke-width="3"/>
<path d="M90 12V2M90 2H111L104 8H90" fill="#f4b942" stroke="#f4b942" stroke-width="2"/>
<path d="M77 124V99A13 13 0 0 1 103 99V124Z" fill="#8a5a38" stroke="#011f3b" stroke-width="2"/>
<circle cx="97" cy="110" r="2" fill="#f4b942"/>
<g fill="#f4b942" stroke="#011f3b" stroke-width="2"><rect x="33" y="80" width="17" height="23" rx="5"/><rect x="131" y="80" width="17" height="23" rx="5"/><rect x="81" y="54" width="18" height="22" rx="7"/></g>
<path d="M41 81V102M132 91H147M139 81V102M34 91H49M90 55V75" stroke="#fff2c6" stroke-width="2"/>
<path d="M72 126H108L115 135H65Z" fill="#f4b942" stroke="#011f3b" stroke-width="2"/>
<g fill="#2f7d5a"><circle cx="22" cy="120" r="10"/><circle cx="158" cy="120" r="10"/></g>
</svg><strong>Journey finish · Quest 52</strong></div></div>
<script>
(()=>{
'use strict';
const W=1000,MIN_HEIGHT=24000;
const pins=document.getElementById('pins'),status=document.getElementById('status'),back=document.getElementById('return');
// about:srcdoc reports a null location.origin despite inheriting the parent's
// security origin. Use the actual embedding origin for the Flutter bridge.
const parentOrigin=(()=>{
 try{return parent.location.origin;}catch(_){}
 try{return new URL(document.referrer).origin;}catch(_){}
 return location.origin;
})();
let current=null,height=MIN_HEIGHT,levels=[];
const viewport=document.getElementById('camera');
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const finishLandmark=document.getElementById('finish-landmark');
const memory=typeof navigator==='undefined'?0:(navigator.deviceMemory||0);
const cores=typeof navigator==='undefined'?0:(navigator.hardwareConcurrency||0);
const lowPower=(memory>0&&memory<=4)||(cores>0&&cores<=4);
const artwork=new Image();let frame=null,artEnabled=!(memory>0&&memory<=2),uprightTexture=null;
artwork.onload=()=>{
 // Blend the join once on a small cached texture. Never reflect scenery:
 // trees, lanterns and waterfalls must retain their original orientation.
 const width=artwork.naturalWidth,height=artwork.naturalHeight;
 const overlap=Math.round(height/6),period=height-overlap;
 const tile=document.createElement('canvas');tile.width=width;tile.height=period;
 const paint=tile.getContext('2d',{alpha:false});
 paint.drawImage(artwork,0,overlap,width,period,0,0,width,period);
 for(let row=0;row<overlap;row++){
  paint.globalAlpha=row/Math.max(1,overlap-1);
  paint.drawImage(artwork,0,row,width,1,0,period-overlap+row,width,1);
 }
 paint.globalAlpha=1;uprightTexture=tile;requestRender();
};
artwork.src='quest_world_light.webp';
function resizeCanvas(){
 // Bound GPU backing memory to the viewport, independent of map length and zoom.
 const dpr=Math.min(devicePixelRatio||1,lowPower?1:1.5);
 canvas.width=Math.max(1,Math.round(viewport.clientWidth*dpr));
 canvas.height=Math.max(1,Math.round(viewport.clientHeight*dpr));
 requestRender();
}
function requestRender(){
 if(frame!==null||document.hidden)return;
 frame=requestAnimationFrame(()=>{frame=null;render();});
}
function render(){
 const vw=viewport.clientWidth,vh=viewport.clientHeight,dpr=canvas.width/Math.max(vw,1),s=camera.scale;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#17655e';ctx.fillRect(0,0,vw,vh);
 const top=-camera.y/s,bottom=(vh-camera.y)/s;
 ctx.save();ctx.translate(camera.x,camera.y);ctx.scale(s,s);
 if(artEnabled&&uprightTexture){
  const tileH=W*uprightTexture.height/uprightTexture.width;
  // The cached texture already blends the seam; drawing is upright and limited
  // to the viewport, with no masks or per-frame blending work.
  for(let i=Math.floor(top/tileH);i<=Math.floor(bottom/tileH);i++){
   ctx.drawImage(uprightTexture,0,i*tileH,W,tileH);
  }
 }
 for(let i=1;i<levels.length;i++){
  const a=levels[i-1],b=levels[i];
  if(Math.max(a.y,b.y)<top-100||Math.min(a.y,b.y)>bottom+100)continue;
  const mid=(a.y+b.y)/2;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x,mid,b.x,mid,b.x,b.y);
  ctx.lineCap='round';ctx.strokeStyle='#124e51';ctx.lineWidth=48;ctx.stroke();
  ctx.strokeStyle='#88c8c0';ctx.lineWidth=29;ctx.stroke();
  if(a.status==='completed'&&(b.status==='completed'||b.status==='current')){ctx.strokeStyle='#f4d789';ctx.lineWidth=6;ctx.stroke();}
 }
 ctx.restore();
 const finish=levels.find(l=>l.id===52);
 if(finish){
  const x=camera.x+finish.x*s,y=camera.y+finish.y*s;
  const offset=vh<=480?174:210;
  finishLandmark.hidden=x<-90||x>vw+90||y-offset>vh||y-60<0;
  if(!finishLandmark.hidden){
   const houseX=Math.max(80,Math.min(vw-80,x));
   finishLandmark.style.left=houseX+'px';finishLandmark.style.top=(y-offset)+'px';
   ctx.beginPath();ctx.moveTo(x,y-27);ctx.lineTo(houseX,y-65);
   ctx.strokeStyle='#f4d789';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  }
 }else finishLandmark.hidden=true;
 for(let i=0;i<levels.length;i++){
  const l=levels[i],button=pins.children[i],x=camera.x+l.x*s,y=camera.y+l.y*s;
  const visible=x>-70&&x<vw+70&&y>-85&&y<vh+85;
  button.hidden=!visible;
  if(visible){button.style.left=x+'px';button.style.top=y+'px';}
 }
}
addEventListener('visibilitychange',()=>{if(document.hidden&&frame!==null){cancelAnimationFrame(frame);frame=null;}else if(!document.hidden)requestRender();});
let camera={x:0,y:0,scale:1},initialized=false,suppressClickUntil=0;
const pointers=new Map();
const baseScale=()=>Math.min(viewport.clientWidth,680)/W;
function drawCamera(){
 const scale=camera.scale,vw=viewport.clientWidth,vh=viewport.clientHeight;
 // Extra breathing room at BOTH ends keeps levels 1 and 52 clear of the HUD.
 camera.x=W*scale<=vw?(vw-W*scale)/2:Math.max(vw-W*scale,Math.min(0,camera.x));
 camera.y=Math.max(vh-height*scale-vh*.65,Math.min(vh*.65,camera.y));
 requestRender();
}
function zoomTo(scale,x=viewport.clientWidth/2,y=viewport.clientHeight/2){
 const next=Math.max(baseScale()*.45,Math.min(baseScale()*2.8,scale));
 const ratio=next/camera.scale;
 camera.x=x-(x-camera.x)*ratio;camera.y=y-(y-camera.y)*ratio;camera.scale=next;drawCamera();
}
function focusLevel(id,reset=false){
 const level=levels.find(l=>l.id===id);if(!level)return;
 if(reset||!initialized)camera.scale=baseScale();
 camera.x=viewport.clientWidth/2-level.x*camera.scale;
 camera.y=viewport.clientHeight*.55-level.y*camera.scale;
 initialized=true;drawCamera();
}
function pair(){const p=[...pointers.values()];return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};}
viewport.addEventListener('pointerdown',event=>{
 if(event.button!==0)return;
 pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY});
 event.target.setPointerCapture(event.pointerId);viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove',event=>{
 const p=pointers.get(event.pointerId);if(!p)return;
 const before=pointers.size===2?pair():null;
 const dx=event.clientX-p.x,dy=event.clientY-p.y;p.x=event.clientX;p.y=event.clientY;
 if(Math.hypot(p.x-p.startX,p.y-p.startY)>6||pointers.size>1)suppressClickUntil=Date.now()+350;
 if(before){const after=pair();zoomTo(camera.scale*after.d/Math.max(before.d,1),before.x,before.y);camera.x+=after.x-before.x;camera.y+=after.y-before.y;}
 else{camera.x+=dx;camera.y+=dy;}drawCamera();
});
for(const type of ['pointerup','pointercancel','lostpointercapture'])viewport.addEventListener(type,event=>{pointers.delete(event.pointerId);if(!pointers.size)viewport.classList.remove('dragging');});
viewport.addEventListener('click',event=>{if(Date.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation();}},true);
viewport.addEventListener('wheel',event=>{
 event.preventDefault();
 if(event.ctrlKey||event.metaKey)zoomTo(camera.scale*Math.exp(-event.deltaY*.008),event.clientX,event.clientY);
 else{camera.x-=event.deltaX;camera.y-=event.deltaY*(event.deltaMode===1?16:1);drawCamera();}
},{passive:false});
viewport.addEventListener('keydown',event=>{
 if(event.target!==viewport)return;
 const steps={ArrowUp:[0,100],ArrowDown:[0,-100],ArrowLeft:[100,0],ArrowRight:[-100,0]};
 if(steps[event.key]){event.preventDefault();camera.x+=steps[event.key][0];camera.y+=steps[event.key][1];drawCamera();}
 if(event.key==='+'||event.key==='=')zoomTo(camera.scale*1.25);
 if(event.key==='-')zoomTo(camera.scale/1.25);
 if(event.key==='Home'){event.preventDefault();focusLevel(levels[0]?.id,true);}
 if(event.key==='End'){event.preventDefault();focusLevel(levels[levels.length-1]?.id,true);}
});
addEventListener('resize',()=>{resizeCanvas();focusLevel(current,true);});
function scrollToLevel(id){focusLevel(id,true);}
function notify(id){
 try{window.flutter_inappwebview?.callHandler('openLevel',id);}catch(_){}
 try{parent.postMessage({source:'quest-map',type:'openLevel',id},parentOrigin==='null'?'*':parentOrigin);}catch(_){}
}
function setLevels(input){
 if(!Array.isArray(input))return;
 levels=input.filter(l=>Number.isInteger(l.id)&&Number.isFinite(l.x)&&Number.isFinite(l.y));
 height=Math.max(MIN_HEIGHT,...levels.map(l=>l.y+600));
 pins.replaceChildren();
 for(const l of levels){
  const b=document.createElement('button');b.type='button';b.className='pin '+(['current','completed','locked'].includes(l.status)?l.status:'unlocked');
  b.dataset.id=String(l.id);
  b.setAttribute('aria-label','Quest '+l.id+(l.id===52?', journey finish':'')+', '+l.status+(l.checkpoint?', checkpoint':''));
  const number=document.createElement('span');number.textContent=l.id;b.appendChild(number);
  if(l.status==='completed'){const stars=document.createElement('small');stars.className='stars';stars.textContent='★'.repeat(Math.max(0,Math.min(3,l.stars|0)));b.appendChild(stars);}
  if(l.status==='current'){const label=document.createElement('span');label.className='current-label';label.textContent='YOU ARE HERE';b.appendChild(label);}
  if(l.status==='locked'){const lock=document.createElement('span');lock.className='lock';lock.setAttribute('aria-hidden','true');lock.innerHTML='<svg width="11" height="13" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="6" width="10" height="7" rx="2"/><path d="M3 6V4a3 3 0 0 1 6 0v2"/></svg>';b.appendChild(lock);}
  else if(l.checkpoint){const flag=document.createElement('span');flag.className='checkpoint';flag.textContent='⚑';flag.setAttribute('aria-hidden','true');b.appendChild(flag);}
  b.onclick=()=>notify(l.id);pins.appendChild(b);
 }
 const active=levels.find(l=>l.status==='current');
 if(active)current=active.id;
 back.disabled=!levels.length;
 if(!initialized&&levels.length)focusLevel(current??levels[0].id,true);else drawCamera();
 status.textContent=levels.length?'Quest '+(current??levels[levels.length-1].id)+' of '+levels.length:'Your quest trail is being prepared';
}
window.QuestMap={setLevels,reveal(id){if(!Number.isInteger(id))return;current=id;scrollToLevel(id,false);if(levels.length)status.textContent='Quest '+id+' of '+levels.length;}};
back.onclick=()=>scrollToLevel(current,true);
addEventListener('message',event=>{
 if(event.source!==parent)return;
 if(event.origin!==parentOrigin&&event.origin!=='null')return;
 let data=event.data;if(typeof data==='string'){try{data=JSON.parse(data);}catch(_){return;}}
 if(!data||typeof data!=='object')return;
 if(data.type==='setLevels')setLevels(data.levels);
 if(data.type==='reveal')window.QuestMap.reveal(data.id);
});
resizeCanvas();
try{parent.postMessage({source:'quest-map',type:'ready'},parentOrigin==='null'?'*':parentOrigin);}catch(_){}
})();
</script></body></html>
