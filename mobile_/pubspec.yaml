name: teen_aventure
description: ASK Hub Teen Discipleship & Bible Puzzles Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1
  video_player: ^2.8.1
  youtube_player_flutter: ^9.1.3
  connectivity_plus: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.3.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  share_plus: ^10.1.4
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/maps/
    - assets/puzzles/
