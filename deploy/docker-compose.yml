services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: teen-api:local
    container_name: teen-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - platform
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=kashchats-vps_default
      - traefik.http.routers.teen-api.rule=Host(`api.teen.elastrocloud.com`)
      - traefik.http.routers.teen-api.entrypoints=websecure
      - traefik.http.routers.teen-api.tls=true
      - traefik.http.routers.teen-api.tls.certresolver=le
      - traefik.http.services.teen-api.loadbalancer.server.port=8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

networks:
  platform:
    external: true
    name: platform
  web:
    external: true
    name: kashchats-vps_default
