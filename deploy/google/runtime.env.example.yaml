# Copy outside the repo, replace these public configuration values.
NODE_ENV: production
# Client IP for rate limits comes from the last X-Forwarded-For hop added by Cloud Run.
TRUST_PROXY_HOPS: "1"
DATABASE: postgres
CORS_ORIGINS: https://YOUR-APP-DOMAIN
ADMIN_PUBLIC_URL: https://YOUR-APP-DOMAIN
# Production requires a remotely hosted PostgreSQL connection supplied through Secret Manager.
FIREBASE_PROJECT_ID: tbadventure-f712a
PRIVATE_UPLOAD_DRIVER: r2
R2_ACCOUNT_ID: YOUR-R2-ACCOUNT
R2_BUCKET: YOUR-PRIVATE-BUCKET
R2_PUBLIC_BUCKET: YOUR-PUBLIC-ASSET-BUCKET
R2_PUBLIC_BASE_URL: https://YOUR-PUBLIC-ASSET-DOMAIN
ALLOW_PUZZLE_STAGING_HEADER: "false"
# Secrets are supplied separately by Secret Manager, never in this file.

# Public CMS reads use R2 snapshots; publish the initial snapshot before enabling.
PUBLISH_PUBLIC_SNAPSHOTS: "true"

# Separate staff frontend for password-setup/reset emails.
DASHBOARD_PUBLIC_URL: https://admin.tba.elastrocloud.com
